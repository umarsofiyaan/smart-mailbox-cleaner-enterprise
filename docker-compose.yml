version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailbox-db
    environment:
      POSTGRES_DB: mailbox_cleaner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailbox-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:localdevpassword@postgres:5432/mailbox_cleaner
      DB_SSL: "false"
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3001
      EXTENSION_ID: placeholder
      # ── Fill these in for local development ──────────────────────────────
      GOOGLE_CLIENT_ID: your_google_client_id_here
      GOOGLE_CLIENT_SECRET: your_google_client_secret_here
      GOOGLE_REDIRECT_URI: http://localhost:3001/auth/google/callback
      JWT_ACCESS_SECRET: your_jwt_access_secret_here
      JWT_REFRESH_SECRET: your_jwt_refresh_secret_here
      ENCRYPTION_KEY: your_encryption_key_here
      STRIPE_SECRET_KEY: sk_test_your_stripe_secret_key
      STRIPE_WEBHOOK_SECRET: whsec_your_webhook_secret
      STRIPE_PRO_PRICE_ID: price_your_price_id
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: mailbox-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_your_publishable_key
      VITE_APP_URL: http://localhost:5173
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
