<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Mailbox Cleaner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Loading state -->
    <div id="loading" class="screen">
      <div class="spinner"></div>
      <p class="loading-text">Loading…</p>
    </div>

    <!-- Login state -->
    <div id="login" class="screen hidden">
      <div class="header">
        <div class="logo">📬</div>
        <h1>Smart Mailbox Cleaner</h1>
        <p class="subtitle">Free up Gmail storage, safely</p>
      </div>
      <button id="login-btn" class="btn btn-primary btn-full">
        <svg width="18" height="18" viewBox="0 0 24 24" class="google-icon">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Connect Gmail
      </button>
      <div class="features">
        <div class="feature">🔒 We never read your messages</div>
        <div class="feature">↩️ Undo any cleanup</div>
        <div class="feature">📊 See exactly what you can free</div>
      </div>
    </div>

    <!-- Dashboard state -->
    <div id="dashboard" class="screen hidden">
      <!-- User bar -->
      <div class="user-bar">
        <div class="user-info">
          <img id="user-avatar" src="" alt="" class="avatar hidden" />
          <div class="user-avatar-placeholder" id="user-avatar-placeholder"></div>
          <div>
            <p id="user-name" class="user-name"></p>
            <span id="plan-badge" class="plan-badge plan-free">Free</span>
          </div>
        </div>
        <button id="logout-btn" class="btn-ghost">Sign out</button>
      </div>

      <!-- Storage bar -->
      <div id="storage-section" class="storage-card hidden">
        <div class="storage-header">
          <span class="storage-label">Gmail Storage</span>
          <span id="storage-pct" class="storage-pct">0%</span>
        </div>
        <div class="storage-bar-bg">
          <div id="storage-bar-fill" class="storage-bar-fill" style="width: 0%"></div>
        </div>
        <div class="storage-detail">
          <span id="storage-used">–</span>
          <span id="storage-quota">– total</span>
        </div>
      </div>

      <!-- Scan section -->
      <div class="scan-section">
        <div id="scan-idle" class="scan-state">
          <p class="scan-message">Scan to see what you can free up</p>
          <button id="scan-btn" class="btn btn-primary btn-full">🔍 Scan Mailbox</button>
        </div>

        <div id="scan-running" class="scan-state hidden">
          <div class="scan-progress">
            <div class="spinner spinner-sm"></div>
            <p class="scan-running-text">Scanning your mailbox…</p>
          </div>
          <p id="scan-messages-count" class="scan-count"></p>
        </div>

        <div id="scan-complete" class="scan-state hidden">
          <!-- Results summary -->
          <div class="result-summary" id="result-summary">
            <div class="result-main">
              <p class="result-label">You can free up</p>
              <p id="result-gb" class="result-gb">0 MB</p>
            </div>
            <button id="rescan-btn" class="btn btn-ghost btn-sm">Re-scan</button>
          </div>

          <!-- Categories -->
          <div id="categories-list" class="categories-list"></div>

          <!-- Pro CTA or open dashboard -->
          <div id="pro-cta" class="pro-cta hidden">
            <p class="pro-cta-text">Upgrade to Pro to clean up</p>
            <button id="upgrade-btn" class="btn btn-primary btn-full">Upgrade — $5/mo</button>
          </div>

          <button id="open-dashboard-btn" class="btn btn-secondary btn-full">
            Open Full Dashboard ↗
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
